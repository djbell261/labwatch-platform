server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: monitoring-api
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/labwatch}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Noah2511}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history_monitoring_api
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} requestId=%X{requestId:-na} userId=%X{userId:-anon} [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka:
    topic:
      health-events: ${HEALTH_EVENTS_TOPIC:health-events}

labwatch:
  cors:
    allowed-origins: ${LABWATCH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  auth:
    enabled: ${LABWATCH_AUTH_ENABLED:false}
  agent-auth:
    enabled: ${LABWATCH_AGENT_AUTH_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

labwatch:
  auth:
    enabled: ${LABWATCH_AUTH_ENABLED:false}
  agent-auth:
    enabled: ${LABWATCH_AGENT_AUTH_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: demo

labwatch:
  auth:
    enabled: false
  agent-auth:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: staging

labwatch:
  auth:
    enabled: ${LABWATCH_AUTH_ENABLED:true}
  agent-auth:
    enabled: ${LABWATCH_AGENT_AUTH_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}

---
spring:
  config:
    activate:
      on-profile: prod

labwatch:
  auth:
    enabled: ${LABWATCH_AUTH_ENABLED:true}
  agent-auth:
    enabled: ${LABWATCH_AGENT_AUTH_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}
