spring:
  datasource:
    url: jdbc:h2:mem:monitoringapi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    root: WARN

app:
  kafka:
    topic:
      auto-create-enabled: false
      health-events: health-events

labwatch:
  auth:
    enabled: false
  agent-auth:
    enabled: false

jwt:
  secret: test-secret-for-monitoring-api-suite-123456
  expiration-minutes: 60
