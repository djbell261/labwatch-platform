server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: ai-engine-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/labwatch}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Noah2511}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:ai-engine-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer:
          value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.example.aiengineservice.dto.HealthEventMessage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

ai:
  provider: ${AI_PROVIDER:openai}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  bedrock:
    model-id: ${BEDROCK_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}

services:
  monitoring-api:
    base-url: ${MONITORING_API_BASE_URL:http://monitoring-api:8089}
  alert-engine:
    base-url: ${ALERT_ENGINE_BASE_URL:http://alert-engine:8088}
  http:
    connect-timeout-ms: ${SERVICES_HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SERVICES_HTTP_READ_TIMEOUT_MS:3000}

labwatch:
  auth:
    enabled: ${LABWATCH_AUTH_ENABLED:false}
  ai:
    anomaly:
      min-baseline-seconds: ${LABWATCH_AI_ANOMALY_MIN_BASELINE_SECONDS:10}
      min-sample-size: ${LABWATCH_AI_ANOMALY_MIN_SAMPLE_SIZE:5}
      z-score-threshold: ${LABWATCH_AI_ANOMALY_Z_SCORE_THRESHOLD:1.5}
      cooldown-seconds: ${LABWATCH_AI_ANOMALY_COOLDOWN_SECONDS:30}
      debug-mode: ${LABWATCH_AI_ANOMALY_DEBUG_MODE:true}
      promotion-enabled: ${LABWATCH_AI_ANOMALY_PROMOTION_ENABLED:true}
      promotion-cooldown-seconds: ${LABWATCH_AI_ANOMALY_PROMOTION_COOLDOWN_SECONDS:300}

app:
  kafka:
    consumer:
      group:
        ai-investigation: ${AI_INVESTIGATION_CONSUMER_GROUP_ID:ai-investigation-group}
    topic:
      auto-create-enabled: ${KAFKA_TOPIC_AUTO_CREATE_ENABLED:true}
      health-events: ${HEALTH_EVENTS_TOPIC:health-events}
      alert-events: ${ALERT_EVENTS_TOPIC:alert-events}
      ai-investigation-events: ${AI_INVESTIGATION_EVENTS_TOPIC:ai-investigation-events}
      anomaly-events: ${ANOMALY_EVENTS_TOPIC:anomaly-events}
  anomaly:
    window-size: ${ANOMALY_WINDOW_SIZE:60}
