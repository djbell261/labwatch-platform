server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: alert-engine
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/labwatch}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Noah2511}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history_alert_engine
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:alert-engine-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer:
          value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.example.alertengine.dto.HealthEventMessage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} requestId=%X{requestId:-na} userId=%X{userId:-anon} [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka:
    retry:
      attempts: ${LABWATCH_KAFKA_RETRY_ATTEMPTS:3}
      backoff-ms: ${LABWATCH_KAFKA_RETRY_BACKOFF_MS:1000}
    topic:
      auto-create-enabled: ${KAFKA_TOPIC_AUTO_CREATE_ENABLED:true}
      health-events: ${HEALTH_EVENTS_TOPIC:health-events}
      alert-events: ${ALERT_EVENTS_TOPIC:alert-events}
      health-events-dlt: ${HEALTH_EVENTS_DLT_TOPIC:health-events.alert-engine.dlt}

labwatch:
  cors:
    allowed-origins: ${LABWATCH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  auth:
    enabled: ${LABWATCH_AUTH_ENABLED:false}

services:
  monitoring-api:
    base-url: ${MONITORING_API_BASE_URL:http://monitoring-api:8089}
  http:
    connect-timeout-ms: ${SERVICES_HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SERVICES_HTTP_READ_TIMEOUT_MS:3000}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: demo

---
spring:
  config:
    activate:
      on-profile: staging

labwatch:
  auth:
    enabled: ${LABWATCH_AUTH_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: prod

labwatch:
  auth:
    enabled: ${LABWATCH_AUTH_ENABLED:true}
