server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: notification-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:notification-service-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer:
          value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.example.notificationservice.dto.AlertEventMessage
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} requestId=%X{requestId:-na} userId=%X{userId:-anon} [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    mail:
      enabled: false

app:
  kafka:
    retry:
      attempts: ${LABWATCH_KAFKA_RETRY_ATTEMPTS:3}
      backoff-ms: ${LABWATCH_KAFKA_RETRY_BACKOFF_MS:1000}
    topic:
      alert-events: ${ALERT_EVENTS_TOPIC:alert-events}
      ai-investigation-events: ${AI_INVESTIGATION_EVENTS_TOPIC:ai-investigation-events}
      alert-events-dlt: ${ALERT_EVENTS_DLT_TOPIC:alert-events.notification-service.dlt}
      ai-investigation-events-dlt: ${AI_INVESTIGATION_EVENTS_DLT_TOPIC:ai-investigation-events.notification-service.dlt}

labwatch:
  notifications:
    cooldown-seconds: ${LABWATCH_NOTIFICATIONS_COOLDOWN_SECONDS:300}
    email:
      enabled: ${LABWATCH_NOTIFICATIONS_EMAIL_ENABLED:false}
      to: ${LABWATCH_ALERT_EMAIL_TO:}
      from: ${LABWATCH_ALERT_EMAIL_FROM:labwatch@localhost}
