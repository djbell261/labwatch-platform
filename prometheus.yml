global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: monitoring-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - monitoring-api:8089

  - job_name: alert-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - alert-engine:8088

  - job_name: ai-engine-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ai-engine-service:8090

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8091
