services:
  postgres:
    image: postgres:16
    container_name: labwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labwatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-labwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: labwatch-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: labwatch-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: labwatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  monitoring-api:
    build:
      context: ./monitoring-api
    container_name: labwatch-monitoring-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${LABWATCH_SPRING_PROFILE:-demo}
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-labwatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEALTH_EVENTS_TOPIC: ${HEALTH_EVENTS_TOPIC:-health-events}
      LABWATCH_AUTH_ENABLED: ${LABWATCH_AUTH_ENABLED:-false}
      LABWATCH_AGENT_AUTH_ENABLED: ${LABWATCH_AGENT_AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  alert-engine:
    build:
      context: ./alert-engine
    container_name: labwatch-alert-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${LABWATCH_SPRING_PROFILE:-demo}
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-labwatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEALTH_EVENTS_TOPIC: ${HEALTH_EVENTS_TOPIC:-health-events}
      ALERT_EVENTS_TOPIC: ${ALERT_EVENTS_TOPIC:-alert-events}
      HEALTH_EVENTS_DLT_TOPIC: ${ALERT_ENGINE_HEALTH_EVENTS_DLT_TOPIC:-health-events.alert-engine.dlt}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${ALERT_ENGINE_CONSUMER_GROUP_ID:-alert-engine-group}
      LABWATCH_AUTH_ENABLED: ${LABWATCH_AUTH_ENABLED:-false}
      MONITORING_API_BASE_URL: http://monitoring-api:8089
      LABWATCH_KAFKA_RETRY_ATTEMPTS: ${LABWATCH_KAFKA_RETRY_ATTEMPTS:-3}
      LABWATCH_KAFKA_RETRY_BACKOFF_MS: ${LABWATCH_KAFKA_RETRY_BACKOFF_MS:-1000}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  notification-service:
    build:
      context: ./notification-service
    container_name: labwatch-notification-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${LABWATCH_SPRING_PROFILE:-demo}
      SERVER_PORT: 8091
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALERT_EVENTS_TOPIC: ${ALERT_EVENTS_TOPIC:-alert-events}
      AI_INVESTIGATION_EVENTS_TOPIC: ${AI_INVESTIGATION_EVENTS_TOPIC:-ai-investigation-events}
      ALERT_EVENTS_DLT_TOPIC: ${NOTIFICATION_ALERT_EVENTS_DLT_TOPIC:-alert-events.notification-service.dlt}
      AI_INVESTIGATION_EVENTS_DLT_TOPIC: ${NOTIFICATION_AI_INVESTIGATION_EVENTS_DLT_TOPIC:-ai-investigation-events.notification-service.dlt}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${NOTIFICATION_SERVICE_CONSUMER_GROUP_ID:-notification-service-group}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LABWATCH_NOTIFICATIONS_EMAIL_ENABLED: "false"
      LABWATCH_ALERT_EMAIL_TO: ""
      LABWATCH_ALERT_EMAIL_FROM: "labwatch@localhost"
      LABWATCH_KAFKA_RETRY_ATTEMPTS: ${LABWATCH_KAFKA_RETRY_ATTEMPTS:-3}
      LABWATCH_KAFKA_RETRY_BACKOFF_MS: ${LABWATCH_KAFKA_RETRY_BACKOFF_MS:-1000}
      SPRING_DATA_REDIS_TIMEOUT: ${SPRING_DATA_REDIS_TIMEOUT:-2s}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  ai-engine-service:
    build:
      context: ./ai-engine-service
    container_name: labwatch-ai-engine-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${LABWATCH_SPRING_PROFILE:-demo}
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-labwatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALERT_EVENTS_TOPIC: ${ALERT_EVENTS_TOPIC:-alert-events}
      AI_INVESTIGATION_EVENTS_TOPIC: ${AI_INVESTIGATION_EVENTS_TOPIC:-ai-investigation-events}
      HEALTH_EVENTS_TOPIC: ${HEALTH_EVENTS_TOPIC:-health-events}
      ANOMALY_EVENTS_TOPIC: ${ANOMALY_EVENTS_TOPIC:-anomaly-events}
      HEALTH_EVENTS_DLT_TOPIC: ${AI_ENGINE_HEALTH_EVENTS_DLT_TOPIC:-health-events.ai-engine.dlt}
      ALERT_EVENTS_DLT_TOPIC: ${AI_ENGINE_ALERT_EVENTS_DLT_TOPIC:-alert-events.ai-engine.dlt}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${AI_ENGINE_CONSUMER_GROUP_ID:-ai-engine-group}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ANOMALY_WINDOW_SIZE: ${ANOMALY_WINDOW_SIZE:-10}
      ANOMALY_MINIMUM_SAMPLES: ${ANOMALY_MINIMUM_SAMPLES:-5}
      ANOMALY_Z_SCORE_THRESHOLD: ${ANOMALY_Z_SCORE_THRESHOLD:-2.5}
      LABWATCH_AI_ANOMALY_PROMOTION_ENABLED: ${LABWATCH_AI_ANOMALY_PROMOTION_ENABLED:-true}
      LABWATCH_AI_ANOMALY_PROMOTION_COOLDOWN_SECONDS: ${LABWATCH_AI_ANOMALY_PROMOTION_COOLDOWN_SECONDS:-300}
      LABWATCH_AI_INVESTIGATION_CONCURRENCY: ${LABWATCH_AI_INVESTIGATION_CONCURRENCY:-4}
      LABWATCH_AI_INVESTIGATION_QUEUE_CAPACITY: ${LABWATCH_AI_INVESTIGATION_QUEUE_CAPACITY:-100}
      LABWATCH_AI_INVESTIGATION_TIMEOUT_MS: ${LABWATCH_AI_INVESTIGATION_TIMEOUT_MS:-15000}
      LABWATCH_KAFKA_RETRY_ATTEMPTS: ${LABWATCH_KAFKA_RETRY_ATTEMPTS:-3}
      LABWATCH_KAFKA_RETRY_BACKOFF_MS: ${LABWATCH_KAFKA_RETRY_BACKOFF_MS:-1000}
      SPRING_DATA_REDIS_TIMEOUT: ${SPRING_DATA_REDIS_TIMEOUT:-2s}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LABWATCH_AUTH_ENABLED: ${LABWATCH_AUTH_ENABLED:-false}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: labwatch-prometheus
    restart: unless-stopped
    depends_on:
      monitoring-api:
        condition: service_healthy
      alert-engine:
        condition: service_healthy
      ai-engine-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.1.4
    container_name: labwatch-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  postgres-data:
  grafana-data:
  redis-data:
