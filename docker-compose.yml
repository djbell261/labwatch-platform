services:
  postgres:
    image: postgres:16
    container_name: labwatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labwatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-labwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: labwatch-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: labwatch-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  monitoring-api:
    build:
      context: ./monitoring-api
    container_name: labwatch-monitoring-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-labwatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEALTH_EVENTS_TOPIC: ${HEALTH_EVENTS_TOPIC:-health-events}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      LABWATCH_AUTH_ENABLED: ${LABWATCH_AUTH_ENABLED:-false}
      LABWATCH_AGENT_AUTH_ENABLED: ${LABWATCH_AGENT_AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    ports:
      - "8089:8089"

  alert-engine:
    build:
      context: ./alert-engine
    container_name: labwatch-alert-engine
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-labwatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEALTH_EVENTS_TOPIC: ${HEALTH_EVENTS_TOPIC:-health-events}
      ALERT_EVENTS_TOPIC: ${ALERT_EVENTS_TOPIC:-alert-events}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${ALERT_ENGINE_CONSUMER_GROUP_ID:-alert-engine-group}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      LABWATCH_AUTH_ENABLED: ${LABWATCH_AUTH_ENABLED:-false}
      MONITORING_API_BASE_URL: http://monitoring-api:8089
    ports:
      - "8088:8088"

  notification-service:
    build:
      context: ./notification-service
    container_name: labwatch-notification-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALERT_EVENTS_TOPIC: ${ALERT_EVENTS_TOPIC:-alert-events}
      AI_INVESTIGATION_EVENTS_TOPIC: ${AI_INVESTIGATION_EVENTS_TOPIC:-ai-investigation-events}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${NOTIFICATION_SERVICE_CONSUMER_GROUP_ID:-notification-service-group}
      LABWATCH_NOTIFICATIONS_EMAIL_ENABLED: "false"
      LABWATCH_ALERT_EMAIL_TO: ""
      LABWATCH_ALERT_EMAIL_FROM: "labwatch@localhost"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""

  ai-engine-service:
    build:
      context: ./ai-engine-service
    container_name: labwatch-ai-engine-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-labwatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALERT_EVENTS_TOPIC: ${ALERT_EVENTS_TOPIC:-alert-events}
      AI_INVESTIGATION_EVENTS_TOPIC: ${AI_INVESTIGATION_EVENTS_TOPIC:-ai-investigation-events}
      HEALTH_EVENTS_TOPIC: ${HEALTH_EVENTS_TOPIC:-health-events}
      ANOMALY_EVENTS_TOPIC: ${ANOMALY_EVENTS_TOPIC:-anomaly-events}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${AI_ENGINE_CONSUMER_GROUP_ID:-ai-engine-group}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      ANOMALY_WINDOW_SIZE: ${ANOMALY_WINDOW_SIZE:-10}
      ANOMALY_MINIMUM_SAMPLES: ${ANOMALY_MINIMUM_SAMPLES:-5}
      ANOMALY_Z_SCORE_THRESHOLD: ${ANOMALY_Z_SCORE_THRESHOLD:-2.5}
      AI_PROVIDER: ${AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      LABWATCH_AUTH_ENABLED: ${LABWATCH_AUTH_ENABLED:-false}
    ports:
      - "8090:8090"

volumes:
  postgres-data:
